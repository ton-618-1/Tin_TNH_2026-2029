<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Lớp 10 Tin - Profile Học Sinh</title>
    
    <style>
        :root {
            --bg-color: #080b14;
            --primary-glow: #a855f7;
            --accent-cyan: #06b6d4;
            --accent-magenta: #ec4899;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(168, 85, 247, 0.15) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(6, 182, 212, 0.12) 0px, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            padding: 30px 20px 60px 20px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* THANH HEADER */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            color: #ffffff;
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .nav-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* BẢNG GIẢNG */
        .board-banner {
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.3) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            margin-bottom: 36px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(112, 26, 117, 0.25);
        }

        .board-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #f472b6;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(236, 72, 153, 0.5);
        }

        /* LƯỚI 4 DÃY BÀN HỌC */
        .seating-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .column-header {
            text-align: center;
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent-cyan);
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
        }

        .desk-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .desk-card:hover {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
            transform: translateY(-2px);
        }

        .desk-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
        }

        .desk-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #e2e8f0;
        }

        /* NÚT DẤU + */
        .btn-plus {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #ffffff;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-plus:hover {
            background: var(--primary-glow);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.8);
            transform: scale(1.15);
        }

        /* KHUNG CHỨA 2 HỌC SINH TRONG 1 BÀN */
        .students-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .student-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .student-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #1e293b;
            flex-shrink: 0;
        }

        .student-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .student-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .student-hobby {
            font-size: 0.72rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* MODAL LIQUID GLASS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(8, 11, 20, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            width: 100%;
            max-width: 680px;
            padding: 26px;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
            backdrop-filter: blur(20px);
            position: relative;
            transform: scale(0.9);
            transition: all 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 20px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover { color: #ffffff; }

        .modal-header-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .student-section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ec4899;
            margin-bottom: 10px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(236, 72, 153, 0.3);
        }

        /* CHIA MỖI BẠN THÀNH 2 CỘT: BÊN TRÁI ẢNH - BÊN PHẢI TÊN & SỞ THÍCH */
        .modal-student-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .modal-content-flex {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        /* CỘT BÊN TRÁI: ẢNH VÀ CỔNG NHẬP LINK */
        .modal-left {
            width: 110px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-avatar-preview {
            width: 90px;
            height: 90px;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            margin-bottom: 8px;
            background: #1e293b;
        }

        .modal-avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* CỘT BÊN PHẢI: TÊN VÀ SỞ THÍCH */
        .modal-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .form-input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.7);
        }

        @media (max-width: 900px) {
            .seating-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 580px) {
            .seating-grid { grid-template-columns: 1fr; }
            .modal-content-flex { flex-direction: column; align-items: center; }
            .modal-left { width: 100%; }
            .modal-right { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOP NAV -->
        <div class="top-nav">
            <a href="index.html" class="back-btn">&larr; Trang Chủ</a>
            <div class="nav-title">SƠ ĐỒ LỚP 10 TIN</div>
            <div style="width: 100px;"></div>
        </div>

        <!-- BẢNG GIẢNG -->
        <div class="board-banner">
            <div class="board-title">[ BẢNG GIẢNG BÀI - PHÍA TRÊN ]</div>
        </div>

        <!-- SƠ ĐỒ 4 DÃY BÀN -->
        <div class="seating-grid" id="seatingGrid"></div>
    </div>

    <!-- MODAL NHẬP THÔNG TIN 2 HỌC SINH -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeProfileModal()">&times;</button>
            <div class="modal-header-title" id="modalDeskName">THÔNG TIN BÀN HỌC</div>

            <form id="deskForm" onsubmit="saveDeskInfo(event)">
                <input type="hidden" id="modalDeskId">

                <!-- HỌC SINH 1 (BÊN TRÁI BÀN) -->
                <div class="modal-student-box">
                    <div class="student-section-title">HỌC SINH A (VỊ TRÍ 1)</div>
                    <div class="modal-content-flex">
                        <div class="modal-left">
                            <div class="modal-avatar-preview">
                                <img id="previewAvatar1" src="" alt="Avatar 1">
                            </div>
                            <div class="form-group" style="width: 100%;">
                                <input type="text" id="inputAvatar1" class="form-input" style="font-size: 0.75rem; padding: 4px 6px;" placeholder="Link ảnh..." oninput="updatePreviewImage(1, this.value)">
                            </div>
                        </div>
                        <div class="modal-right">
                            <div class="form-group">
                                <label>Tên học sinh:</label>
                                <input type="text" id="inputName1" class="form-input" placeholder="Nhập tên..." required>
                            </div>
                            <div class="form-group">
                                <label>Sở thích:</label>
                                <input type="text" id="inputHobby1" class="form-input" placeholder="Nhập sở thích..." required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- HỌC SINH 2 (BÊN PHẢI BÀN) -->
                <div class="modal-student-box">
                    <div class="student-section-title">HỌC SINH B (VỊ TRÍ 2)</div>
                    <div class="modal-content-flex">
                        <div class="modal-left">
                            <div class="modal-avatar-preview">
                                <img id="previewAvatar2" src="" alt="Avatar 2">
                            </div>
                            <div class="form-group" style="width: 100%;">
                                <input type="text" id="inputAvatar2" class="form-input" style="font-size: 0.75rem; padding: 4px 6px;" placeholder="Link ảnh..." oninput="updatePreviewImage(2, this.value)">
                            </div>
                        </div>
                        <div class="modal-right">
                            <div class="form-group">
                                <label>Tên học sinh:</label>
                                <input type="text" id="inputName2" class="form-input" placeholder="Nhập tên..." required>
                            </div>
                            <div class="form-group">
                                <label>Sở thích:</label>
                                <input type="text" id="inputHobby2" class="form-input" placeholder="Nhập sở thích..." required>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">LƯU CẢ 2 HỌC SINH</button>
            </form>
        </div>
    </div>

    <script>
        // Khởi tạo 24 bàn học, mỗi bàn có 2 học sinh
        const defaultDesks = Array.from({ length: 24 }, (_, i) => ({
            id: i + 1,
            row: Math.floor(i / 6) + 1,
            num: (i % 6) + 1,
            s1: {
                name: `Học sinh ${i*2 + 1}`,
                avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=Student${i*2 + 1}`,
                hobby: "Lập trình & Thể thao"
            },
            s2: {
                name: `Học sinh ${i*2 + 2}`,
                avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=Student${i*2 + 2}`,
                hobby: "Âm nhạc & Gaming"
            }
        }));

        // Lấy dữ liệu lưu trong LocalStorage nếu có
        let desksData = JSON.parse(localStorage.getItem('class_desks_v5_pair')) || defaultDesks;

        function renderGrid() {
            const grid = document.getElementById('seatingGrid');
            grid.innerHTML = '';

            for (let col = 1; col <= 4; col++) {
                const colDiv = document.createElement('div');
                colDiv.className = 'grid-column';
                
                const colHeader = document.createElement('div');
                colHeader.className = 'column-header';
                colHeader.innerText = `DÃY ${col}`;
                colDiv.appendChild(colHeader);

                const colDesks = desksData.slice((col - 1) * 6, col * 6);

                colDesks.forEach((desk) => {
                    const card = document.createElement('div');
                    card.className = 'desk-card';
                    card.innerHTML = `
                        <div class="desk-header">
                            <span class="desk-title">Bàn ${desk.num} (Dãy ${col})</span>
                            <button class="btn-plus" onclick="openProfileModal(${desk.id})">+</button>
                        </div>
                        <div class="students-container">
                            <div class="student-item">
                                <img class="student-avatar" src="${desk.s1.avatar}" alt="Avatar">
                                <div class="student-info">
                                    <span class="student-name">${desk.s1.name}</span>
                                    <span class="student-hobby">${desk.s1.hobby}</span>
                                </div>
                            </div>
                            <div class="student-item">
                                <img class="student-avatar" src="${desk.s2.avatar}" alt="Avatar">
                                <div class="student-info">
                                    <span class="student-name">${desk.s2.name}</span>
                                    <span class="student-hobby">${desk.s2.hobby}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    colDiv.appendChild(card);
                });

                grid.appendChild(colDiv);
            }
        }

        // Mở Modal khi bấm dấu +
        function openProfileModal(id) {
            const desk = desksData.find(d => d.id === id);
            if (!desk) return;

            document.getElementById('modalDeskId').value = desk.id;
            document.getElementById('modalDeskName').innerText = `BÀN ${desk.num} - DÃY ${desk.row}`;
            
            // Điền thông tin học sinh 1
            document.getElementById('inputName1').value = desk.s1.name;
            document.getElementById('inputHobby1').value = desk.s1.hobby;
            document.getElementById('inputAvatar1').value = desk.s1.avatar.includes('dicebear.com') ? '' : desk.s1.avatar;
            document.getElementById('previewAvatar1').src = desk.s1.avatar;

            // Điền thông tin học sinh 2
            document.getElementById('inputName2').value = desk.s2.name;
            document.getElementById('inputHobby2').value = desk.s2.hobby;
            document.getElementById('inputAvatar2').value = desk.s2.avatar.includes('dicebear.com') ? '' : desk.s2.avatar;
            document.getElementById('previewAvatar2').src = desk.s2.avatar;

            document.getElementById('profileModal').classList.add('active');
        }

        // Cập nhật ảnh xem trước khi thay đổi URL
        function updatePreviewImage(studentNum, url) {
            const preview = document.getElementById(`previewAvatar${studentNum}`);
            const deskId = document.getElementById('modalDeskId').value;
            if (url.trim() !== '') {
                preview.src = url;
            } else {
                const seedId = parseInt(deskId) * 2 - (studentNum === 1 ? 1 : 0);
                preview.src = `https://api.dicebear.com/7.x/bottts/svg?seed=Student${seedId}`;
            }
        }

        // Lưu thông tin cả 2 học sinh
        function saveDeskInfo(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('modalDeskId').value);
            const desk = desksData.find(d => d.id === id);

            if (desk) {
                // Lấy dữ liệu học sinh 1
                const name1 = document.getElementById('inputName1').value.trim();
                const hobby1 = document.getElementById('inputHobby1').value.trim();
                const avatar1 = document.getElementById('inputAvatar1').value.trim();

                desk.s1.name = name1;
                desk.s1.hobby = hobby1;
                desk.s1.avatar = avatar1 !== '' ? avatar1 : `https://api.dicebear.com/7.x/bottts/svg?seed=Student${id*2 - 1}`;

                // Lấy dữ liệu học sinh 2
                const name2 = document.getElementById('inputName2').value.trim();
                const hobby2 = document.getElementById('inputHobby2').value.trim();
                const avatar2 = document.getElementById('inputAvatar2').value.trim();

                desk.s2.name = name2;
                desk.s2.hobby = hobby2;
                desk.s2.avatar = avatar2 !== '' ? avatar2 : `https://api.dicebear.com/7.x/bottts/svg?seed=Student${id*2}`;

                localStorage.setItem('class_desks_v5_pair', JSON.stringify(desksData));
                renderGrid();
                closeProfileModal();
            }
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
        }

        document.getElementById('profileModal').addEventListener('click', function(e) {
            if (e.target === this) closeProfileModal();
        });

        // Khởi tạo sơ đồ bàn học
        renderGrid();
    </script>
</body>
</html>
