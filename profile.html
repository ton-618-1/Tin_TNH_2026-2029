<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Lớp 10 Tin - Profile Học Sinh</title>
    
    <style>
        :root {
            --bg-color: #080b14;
            --primary-glow: #a855f7;
            --accent-cyan: #06b6d4;
            --accent-magenta: #ec4899;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(168, 85, 247, 0.15) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(6, 182, 212, 0.12) 0px, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            padding: 30px 20px 60px 20px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* THANH HEADER */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            color: #ffffff;
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .nav-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* BẢNG GIẢNG */
        .board-banner {
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.3) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            margin-bottom: 36px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(112, 26, 117, 0.25);
        }

        .board-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #f472b6;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(236, 72, 153, 0.5);
        }

        /* LƯỚI 4 DÃY BÀN HỌC */
        .seating-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .column-header {
            text-align: center;
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent-cyan);
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
        }

        .desk-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .desk-card:hover {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
            transform: translateY(-2px);
        }

        .desk-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
        }

        .desk-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #e2e8f0;
        }

        /* NÚT DẤU + */
        .btn-plus {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #ffffff;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-plus:hover {
            background: var(--primary-glow);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.8);
            transform: scale(1.15);
        }

        .student-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
        }

        .student-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #1e293b;
            flex-shrink: 0;
        }

        .student-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* MODAL LIQUID GLASS KHI BẤM DẤU + */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(8, 11, 20, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            width: 100%;
            max-width: 620px;
            padding: 28px;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
            backdrop-filter: blur(20px);
            position: relative;
            transform: scale(0.9);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 20px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover { color: #ffffff; }

        .modal-header-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* CHIA BẢNG: BÊN TRÁI LÀ ẢNH - BÊN PHẢI LÀ TÊN & SỞ THÍCH */
        .modal-content-flex {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        /* CỘT BÊN TRÁI: KHUNG ẢNH & Ô NHẬP LINK ẢNH */
        .modal-left {
            width: 150px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-avatar-preview {
            width: 130px;
            height: 130px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            margin-bottom: 10px;
            background: #1e293b;
        }

        .modal-avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* CỘT BÊN PHẢI: TÊN VÀ SỞ THÍCH */
        .modal-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f472b6;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.7);
        }

        @media (max-width: 900px) {
            .seating-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 580px) {
            .seating-grid { grid-template-columns: 1fr; }
            .modal-content-flex { flex-direction: column; align-items: center; }
            .modal-left { width: 100%; }
            .modal-right { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOP NAV -->
        <div class="top-nav">
            <a href="index.html" class="back-btn">&larr; Trang Chủ</a>
            <div class="nav-title">SƠ ĐỒ LỚP 10 TIN</div>
            <div style="width: 100px;"></div>
        </div>

        <!-- BẢNG GIẢNG -->
        <div class="board-banner">
            <div class="board-title">[ BẢNG GIẢNG BÀI - PHÍA TRÊN ]</div>
        </div>

        <!-- SƠ ĐỒ 4 DÃY BÀN -->
        <div class="seating-grid" id="seatingGrid"></div>
    </div>

    <!-- MODAL ĐIỀN / SỬA PROFILE KHI BẤM DẤU + -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeProfileModal()">&times;</button>
            <div class="modal-header-title" id="modalDeskName">THÔNG TIN BÀN 1</div>

            <form id="deskForm" onsubmit="saveDeskInfo(event)">
                <input type="hidden" id="modalDeskId">

                <div class="modal-content-flex">
                    <!-- BÊN TRÁI: KHUNG ẢNH VÀ LINK ẢNH -->
                    <div class="modal-left">
                        <div class="modal-avatar-preview">
                            <img id="avatarPreview" src="" alt="Avatar">
                        </div>
                        <div class="form-group" style="width: 100%;">
                            <label style="font-size: 0.75rem; text-align: center;">Link Ảnh (Có thể bỏ trống)</label>
                            <input type="text" id="inputAvatar" class="form-input" style="font-size: 0.8rem; padding: 6px 8px;" placeholder="https://..." oninput="updatePreviewImage(this.value)">
                        </div>
                    </div>

                    <!-- BÊN PHẢI: TÊN & SỞ THÍCH -->
                    <div class="modal-right">
                        <div class="form-group">
                            <label>Họ và Tên Học Sinh:</label>
                            <input type="text" id="inputName" class="form-input" placeholder="Nhập tên học sinh..." required>
                        </div>

                        <div class="form-group">
                            <label>Sở thích cá nhân:</label>
                            <input type="text" id="inputHobby" class="form-input" placeholder="Nhập sở thích (Ví dụ: Đá bóng, Lập trình...)" required>
                        </div>

                        <button type="submit" class="btn-submit">Lưu Thông Tin Bàn Học</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Khởi tạo 24 bàn học mặc định
        const defaultDesks = Array.from({ length: 24 }, (_, i) => ({
            id: i + 1,
            row: Math.floor(i / 6) + 1,
            num: (i % 6) + 1,
            name: `Học sinh Bàn ${i + 1}`,
            avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=Desk${i + 1}`,
            hobby: "Yêu thích môn Tin học, lập trình và thể thao."
        }));

        // Lấy dữ liệu lưu trong LocalStorage nếu có
        let desksData = JSON.parse(localStorage.getItem('class_desks_v4')) || defaultDesks;

        function renderGrid() {
            const grid = document.getElementById('seatingGrid');
            grid.innerHTML = '';

            for (let col = 1; col <= 4; col++) {
                const colDiv = document.createElement('div');
                colDiv.className = 'grid-column';
                
                const colHeader = document.createElement('div');
                colHeader.className = 'column-header';
                colHeader.innerText = `DÃY ${col}`;
                colDiv.appendChild(colHeader);

                const colDesks = desksData.slice((col - 1) * 6, col * 6);

                colDesks.forEach((desk) => {
                    const card = document.createElement('div');
                    card.className = 'desk-card';
                    card.innerHTML = `
                        <div class="desk-header">
                            <span class="desk-title">Bàn ${desk.num} (Dãy ${col})</span>
                            <button class="btn-plus" onclick="openProfileModal(${desk.id})">+</button>
                        </div>
                        <div class="student-item">
                            <img class="student-avatar" src="${desk.avatar}" alt="Avatar">
                            <span class="student-name">${desk.name}</span>
                        </div>
                    `;
                    colDiv.appendChild(card);
                });

                grid.appendChild(colDiv);
            }
        }

        // Mở Modal khi bấm dấu +
        function openProfileModal(id) {
            const desk = desksData.find(d => d.id === id);
            if (!desk) return;

            document.getElementById('modalDeskId').value = desk.id;
            document.getElementById('modalDeskName').innerText = `BÀN ${desk.num} - DÃY ${desk.row}`;
            
            document.getElementById('inputName').value = desk.name;
            document.getElementById('inputHobby').value = desk.hobby;
            
            // Nếu dùng ảnh mặc định DiceBear thì để trống ô link ảnh để bạn dễ thay
            if (desk.avatar.includes('api.dicebear.com')) {
                document.getElementById('inputAvatar').value = '';
            } else {
                document.getElementById('inputAvatar').value = desk.avatar;
            }

            document.getElementById('avatarPreview').src = desk.avatar;
            document.getElementById('profileModal').classList.add('active');
        }

        // Cập nhật ảnh xem trước khi gõ URL
        function updatePreviewImage(url) {
            const preview = document.getElementById('avatarPreview');
            const deskId = document.getElementById('modalDeskId').value;
            if (url.trim() !== '') {
                preview.src = url;
            } else {
                preview.src = `https://api.dicebear.com/7.x/bottts/svg?seed=Desk${deskId}`;
            }
        }

        // Lưu thông tin bàn học
        function saveDeskInfo(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('modalDeskId').value);
            const desk = desksData.find(d => d.id === id);

            if (desk) {
                const nameInput = document.getElementById('inputName').value.trim();
                const hobbyInput = document.getElementById('inputHobby').value.trim();
                const avatarInput = document.getElementById('inputAvatar').value.trim();

                desk.name = nameInput;
                desk.hobby = hobbyInput;
                
                // Nếu không điền ảnh -> Dùng ảnh ngẫu nhiên theo ID bàn
                if (avatarInput !== '') {
                    desk.avatar = avatarInput;
                } else {
                    desk.avatar = `https://api.dicebear.com/7.x/bottts/svg?seed=Desk${id}`;
                }

                localStorage.setItem('class_desks_v4', JSON.stringify(desksData));
                renderGrid();
                closeProfileModal();
            }
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
        }

        // Đóng modal khi click ra ngoài
        document.getElementById('profileModal').addEventListener('click', function(e) {
            if (e.target === this) closeProfileModal();
        });

        // Khởi tạo sơ đồ
        renderGrid();
    </script>
</body>
</html>
