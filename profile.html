<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Lớp 10 Tin - Profile & Điểm Danh</title>
    
    <style>
        :root {
            --bg-color: #080b14;
            --primary-glow: #a855f7;
            --accent-cyan: #06b6d4;
            --accent-magenta: #ec4899;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(168, 85, 247, 0.15) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(6, 182, 212, 0.12) 0px, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            padding: 30px 20px 60px 20px;
            min-height: 100vh;
        }

        .container { max-width: 1240px; margin: 0 auto; }

        /* THANH ĐIỀU HƯỚNG / HEADER */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            color: #ffffff;
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .nav-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* NÚT LIQUID GLASS CHUNG */
        .btn-liquid {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-liquid:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: rgba(236, 72, 153, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        /* BẢNG GIẢNG */
        .board-banner {
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.3) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 36px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(112, 26, 117, 0.25);
        }

        .board-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #f472b6;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(236, 72, 153, 0.5);
        }

        /* LƯỚI 4 DÃY BÀN HỌC */
        .seating-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .column-header {
            text-align: center;
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent-cyan);
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
        }

        .desk-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
        }

        .desk-card:hover {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
            transform: translateY(-3px);
        }

        .desk-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
        }

        .desk-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #e2e8f0;
        }

        .btn-plus {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-plus:hover {
            background: var(--primary-glow);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
            transform: scale(1.1);
        }

        .students-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .student-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 6px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .student-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #1e293b;
            flex-shrink: 0;
        }

        .student-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* MODAL LIQUID GLASS HIỂN THỊ PROFILE 2 HỌC SINH */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(8, 11, 20, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            width: 100%;
            max-width: 750px;
            padding: 28px;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
            backdrop-filter: blur(20px);
            position: relative;
            transform: scale(0.9);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 20px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover { color: #ffffff; }

        .modal-header-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .modal-students-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .student-profile-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .modal-avatar-box {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            margin-bottom: 12px;
        }

        .modal-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-student-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .modal-hobby-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.5;
            text-align: left;
        }

        .modal-hobby-box strong { color: #f472b6; }

        @media (max-width: 900px) {
            .seating-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .seating-grid { grid-template-columns: 1fr; }
            .modal-students-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOP NAV -->
        <div class="top-nav">
            <a href="index.html" class="back-btn">&larr; Trang Chủ</a>
            <div class="nav-title">SƠ ĐỒ LỚP 10 TIN</div>
            <button class="btn-liquid" onclick="openAdminModal()">Admin Edit</button>
        </div>

        <!-- BẢNG GIẢNG -->
        <div class="board-banner">
            <div class="board-title">[ BẢNG GIẢNG BÀI - PHÍA TRÊN ]</div>
        </div>

        <!-- SƠ ĐỒ 4 DÃY BÀN -->
        <div class="seating-grid" id="seatingGrid">
            <!-- Render từ Javascript -->
        </div>
    </div>

    <!-- MODAL XEM PROFILE CỦA CẢ 2 HỌC SINH -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeProfileModal()">&times;</button>
            <div class="modal-header-title" id="modalDeskName">THÔNG TIN BÀN 1 - DÃY 1</div>
            
            <div class="modal-students-grid">
                <!-- Học sinh 1 -->
                <div class="student-profile-box">
                    <div class="modal-avatar-box">
                        <img id="s1Img" src="" alt="Student 1">
                    </div>
                    <div class="modal-student-name" id="s1Name">Học Sinh 1</div>
                    <div class="modal-hobby-box">
                        <strong>Sở thích:</strong> <span id="s1Hobby">Chưa cập nhật</span>
                    </div>
                </div>

                <!-- Học sinh 2 -->
                <div class="student-profile-box">
                    <div class="modal-avatar-box">
                        <img id="s2Img" src="" alt="Student 2">
                    </div>
                    <div class="modal-student-name" id="s2Name">Học Sinh 2</div>
                    <div class="modal-hobby-box">
                        <strong>Sở thích:</strong> <span id="s2Hobby">Chưa cập nhật</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo dữ liệu lớp học mặc định (24 bàn, mỗi bàn 2 học sinh)
        const defaultDesks = Array.from({ length: 24 }, (_, i) => ({
            id: i + 1,
            row: Math.floor(i / 6) + 1,
            num: (i % 6) + 1,
            s1: {
                name: `Học sinh ${i*2 + 1}`,
                avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=Student${i*2 + 1}`,
                hobby: "Thích lập trình Python, chơi bóng đá."
            },
            s2: {
                name: `Học sinh ${i*2 + 2}`,
                avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=Student${i*2 + 2}`,
                hobby: "Thích thiết kế web, nghe nhạc, chơi game."
            }
        }));

        // Lấy dữ liệu đã lưu từ LocalStorage hoặc dùng mặc định
        let desksData = JSON.parse(localStorage.getItem('class_desks_data_v2')) || defaultDesks;

        function renderGrid() {
            const grid = document.getElementById('seatingGrid');
            grid.innerHTML = '';

            for (let col = 1; col <= 4; col++) {
                const colDiv = document.createElement('div');
                colDiv.className = 'grid-column';
                
                const colHeader = document.createElement('div');
                colHeader.className = 'column-header';
                colHeader.innerText = `DÃY ${col}`;
                colDiv.appendChild(colHeader);

                // Lấy 6 bàn cho dãy này
                const colDesks = desksData.slice((col - 1) * 6, col * 6);

                colDesks.forEach((desk) => {
                    const card = document.createElement('div');
                    card.className = 'desk-card';
                    card.innerHTML = `
                        <div class="desk-header">
                            <span class="desk-title">Bàn ${desk.num} (Dãy ${col})</span>
                            <button class="btn-plus" onclick="showProfile(${desk.id})">+</button>
                        </div>
                        <div class="students-list">
                            <div class="student-item">
                                <img class="student-avatar" src="${desk.s1.avatar}" alt="Avatar">
                                <span class="student-name">${desk.s1.name}</span>
                            </div>
                            <div class="student-item">
                                <img class="student-avatar" src="${desk.s2.avatar}" alt="Avatar">
                                <span class="student-name">${desk.s2.name}</span>
                            </div>
                        </div>
                    `;
                    colDiv.appendChild(card);
                });

                grid.appendChild(colDiv);
            }
        }

        // Xem profile cả 2 HS khi bấm dấu +
        function showProfile(id) {
            const desk = desksData.find(d => d.id === id);
            if (!desk) return;

            document.getElementById('modalDeskName').innerText = `THÔNG TIN BÀN ${desk.num} - DÃY ${desk.row}`;
            
            // HS 1
            document.getElementById('s1Name').innerText = desk.s1.name;
            document.getElementById('s1Img').src = desk.s1.avatar;
            document.getElementById('s1Hobby').innerText = desk.s1.hobby;

            // HS 2
            document.getElementById('s2Name').innerText = desk.s2.name;
            document.getElementById('s2Img').src = desk.s2.avatar;
            document.getElementById('s2Hobby').innerText = desk.s2.hobby;

            document.getElementById('profileModal').classList.add('active');
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
        }

        // Chức năng Admin sửa từng học sinh ở từng bàn
        function openAdminModal() {
            const password = prompt("Nhập mật khẩu Admin (Tên cầu thủ yêu thích nhất của chủ web):");
            if (!password) return;

            const cleanPass = password.trim().toLowerCase();
            if (cleanPass === 'zidane' || cleanPass === 'zinedine zidane') {
                const deskId = prompt("Nhập số thứ tự bàn muốn chỉnh sửa (Từ 1 đến 24):");
                const idNum = parseInt(deskId);
                
                if (idNum >= 1 && idNum <= 24) {
                    const currentDesk = desksData.find(d => d.id === idNum);
                    const pos = prompt("Bạn muốn sửa Học Sinh 1 hay Học Sinh 2? (Nhập '1' hoặc '2'):");

                    if (pos === '1' || pos === '2') {
                        const studentKey = pos === '1' ? 's1' : 's2';
                        const currentStudent = currentDesk[studentKey];

                        const newName = prompt(`[Bàn ${idNum} - HS ${pos}] Nhập Họ và Tên:`, currentStudent.name);
                        const newAvatar = prompt(`[Bàn ${idNum} - HS ${pos}] Nhập URL Ảnh đại diện:`, currentStudent.avatar);
                        const newHobby = prompt(`[Bàn ${idNum} - HS ${pos}] Nhập Sở thích:`, currentStudent.hobby);

                        if (newName) currentStudent.name = newName;
                        if (newAvatar) currentStudent.avatar = newAvatar;
                        if (newHobby) currentStudent.hobby = newHobby;

                        localStorage.setItem('class_desks_data_v2', JSON.stringify(desksData));
                        renderGrid();
                        alert(`Đã cập nhật thông tin thành công cho Học Sinh ${pos} - Bàn ${idNum}!`);
                    } else {
                        alert("Vị trí lựa chọn không hợp lệ!");
                    }
                } else {
                    alert("Số bàn không hợp lệ!");
                }
            } else {
                alert("Mật khẩu Admin không chính xác!");
            }
        }

        // Đóng Modal khi bấm ra ngoài card
        document.getElementById('profileModal').addEventListener('click', function(e) {
            if (e.target === this) closeProfileModal();
        });

        // Khởi tạo giao diện
        renderGrid();
    </script>
</body>
</html>
